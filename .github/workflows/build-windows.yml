name: Build Windows x64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore STAVCMS.LocalServer.sln

      - name: Build
        run: dotnet build STAVCMS.LocalServer.sln -c Release --no-restore

      - name: Publish portable Windows x64 executable
        run: dotnet publish src/STAVCMS.LocalServer.Cli/STAVCMS.LocalServer.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Add portable config
        shell: pwsh
        run: |
          Copy-Item -Path config -Destination publish/config -Recurse -Force
          New-Item -ItemType Directory -Force -Path publish/bin, publish/logs, publish/runtime, publish/projects, publish/databases, publish/backups, publish/ssl | Out-Null

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: STAVCMS-LocalServer-0.1-win-x64
          path: publish/**
          if-no-files-found: error
